<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive viewport QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:10px;position:sticky;top:0;background:white}iframe{display:block;border:1px solid #888;margin:10px auto;background:white;width:390px;height:844px}label{margin-right:18px}</style><header><label>Page <select id="page"></select></label><label>Viewport <select id="width"><option value="390">390px phone-sized</option><option value="768">768px tablet-sized</option><option value="1363">1363px desktop</option></select></label><span id="status">Responsive CSS viewport only; not device or touch emulation.</span></header><iframe id="site" title="Research site viewport"></iframe><script>const paths=['index.html','earnings/','analysts/','analysts/thoughts.html','hot-chips/','architects/','notes/','bridge/','policy/','standards/','customers/','benchmarks/','energy/','calendar/','method/','search.html'];const page=document.getElementById('page'),frame=document.getElementById('site');paths.forEach(p=>page.add(new Option(p,p)));page.onchange=()=>frame.src='/ai/'+page.value;document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';page.onchange();</script></html>
