name: Verify live earnings release update
on:
  push:
    branches: ['research/manual-refresh-20261115']
    paths: ['.github/workflows/verify-earnings-live-20261115.yml']
permissions:
  contents: read
jobs:
  verify-live:
    if: github.repository == 'wilwan01/wilwan01.github.io' && github.ref_name == 'research/manual-refresh-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec5cbbb9b946cbcad75d39bbbd0f7f6afb506833
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public bytes match the merged source
        run: |
          mkdir -p browser-results
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.request
          commit='ec5cbbb9b946cbcad75d39bbbd0f7f6afb506833'
          paths=['ai/analysts/corpus.json','ai/earnings/index.html','ai/earnings/coverage-progression.json','ai/earnings/refresh-ledger.json','ai/earnings/research/results-followthrough-20261115.json','ai/search-index.json']
          report={'commit':commit,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Read-only public deployment verification; no repository writes','files':[]}
          for path in paths:
            url='https://wilwan01.github.io/'+path+'?verified_commit='+commit
            row={'path':path,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'AI-Infra-public-deployment-check','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read();row['http_status']=r.status
              expected=pathlib.Path(path).read_bytes()
              row.update(matches_source=data==expected,actual_sha256=hashlib.sha256(data).hexdigest(),expected_sha256=hashlib.sha256(expected).hexdigest())
            except Exception as ex:
              row.update(matches_source=False,error=str(ex))
            report['files'].append(row)
          report['status']='passed' if all(x.get('matches_source') for x in report['files']) else 'failed'
          pathlib.Path('browser-results/live-byte-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert report['status']=='passed','Public files do not all match the merged source'
          PY
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify live desktop and mobile interactions
        env:
          NODE_PATH: ${{ runner.temp }}/browser-deps/node_modules
          TESTED_SHA: ec5cbbb9b946cbcad75d39bbbd0f7f6afb506833
          TEST_BASE_URL: https://wilwan01.github.io
        run: node scripts/check-earnings-results-20261115.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earnings-live-verification-ec5cbbb9
          path: browser-results/
          retention-days: 14
