name: Architects browser smoke
on:
  pull_request:
    paths:
      - 'ai/architects/**'
      - 'ai/search*'
      - '.github/workflows/architects-browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test exact PR head at desktop and mobile sizes
        env:
          NODE_PATH: ${{ runner.temp }}/browser-deps/node_modules
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p browser-results
          python3 -m http.server 8765 --bind 127.0.0.1 > browser-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ai/architects/catalog.json -o /dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const report={sha:process.env.TESTED_SHA,observedAt:new Date().toISOString(),rows:[],status:'running'};
          (async()=>{
            const browser=await chromium.launch();
            try {
              const catalog=JSON.parse(fs.readFileSync('ai/architects/catalog.json','utf8'));
              const index=JSON.parse(fs.readFileSync('ai/search-index.json','utf8'));
              assert.equal(catalog.research.totalProfiles,catalog.profiles.length);
              assert.equal(new Set(catalog.profiles.map(p=>p.id)).size,catalog.profiles.length);
              const expectedProfiles=catalog.profiles.length;
              const targets=[['Jeff McVeigh','jeff-mcveigh'],['Jeff Wilcox','jeff-wilcox'],['Gary Smerdon','gary-smerdon'],['Robert Hormuth','robert-hormuth']];
              assert(catalog.profiles.some(p=>p.id==='anil-kumar-amd-austin'));
              targets.push(['Anil Kumar','anil-kumar-amd-austin']);
              const batchPath='ai/architects/research/batches/2026-11-12-intel-nominations.json';
              const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
              const admitted=batch.records.filter(r=>r.status==='complete');
              const pending=batch.records.filter(r=>r.status!=='complete');
              assert.equal(admitted.length,batch.completedNew);
              for(const record of admitted){
                const profile=catalog.profiles.find(p=>p.id===record.id);
                assert(profile,`Missing admitted profile ${record.id}`);
                assert.equal(profile.researchStatus.batch,'2026-11-12-intel-nominations');
                if(!targets.some(([,id])=>id===record.id)) targets.push([profile.name,profile.id]);
              }
              for(const record of pending){
                assert(!catalog.profiles.some(p=>p.id===record.id),`Pending candidate in catalog: ${record.id}`);
                assert(!index.entries.some(x=>x.u===`/ai/architects/#${record.id}`),`Pending candidate in search: ${record.id}`);
              }
              const laraBatchPath='ai/architects/research/batches/2026-11-12-lara-oliver.json';
              const laraBatch=JSON.parse(fs.readFileSync(laraBatchPath,'utf8'));
              assert.equal(laraBatch.completedNew,1);
              const laraRecords=laraBatch.records.filter(r=>r.status==='complete');
              assert.equal(laraRecords.length,1);
              assert.equal(laraRecords[0].id,'lara-oliver');
              const lara=catalog.profiles.find(p=>p.id==='lara-oliver');
              assert(lara,'Missing admitted Lara Oliver profile');
              assert.equal(lara.name,'Lara Oliver');
              assert.equal(lara.researchStatus.batch,'2026-11-12-lara-oliver');
              targets.push([lara.name,lara.id]);
              const historicalCandidate=pending.find(r=>r.id==='oliver-lara-intel-candidate');
              assert(historicalCandidate,'Historical nomination record must be preserved');
              assert.equal(historicalCandidate.resolution.status,'admitted-in-other-batch');
              assert.equal(historicalCandidate.resolution.profileId,'lara-oliver');
              const conferenceBatchId='2026-11-12-conference-followup';
              const conferenceBatchPath=`ai/architects/research/batches/${conferenceBatchId}.json`;
              assert(fs.existsSync(conferenceBatchPath),'Missing conference followup admission batch');
              const conferenceBatch=JSON.parse(fs.readFileSync(conferenceBatchPath,'utf8'));
              assert(Array.isArray(conferenceBatch.records),'Conference batch records must be an array');
              const conferenceComplete=conferenceBatch.records.filter(r=>r.status==='complete');
              const conferencePending=conferenceBatch.records.filter(r=>r.status!=='complete');
              assert(conferenceBatch.completedNew>0,'Conference batch must admit at least one new profile');
              assert.equal(conferenceComplete.filter(r=>r.kind==='candidate').length,conferenceBatch.completedNew);
              assert.equal(conferenceComplete.filter(r=>r.kind==='existing').length,conferenceBatch.completedExisting);
              assert.equal(conferenceComplete.length,conferenceBatch.completedNew+conferenceBatch.completedExisting);
              assert.equal(conferenceBatch.records.length,conferenceBatch.plannedScope);
              assert.equal(new Set(conferenceBatch.records.map(r=>r.id)).size,conferenceBatch.records.length);
              const actualCounts={};
              for(const record of conferenceBatch.records) actualCounts[record.status]=(actualCounts[record.status]||0)+1;
              assert.deepEqual(conferenceBatch.counts,actualCounts);
              for(const record of conferenceComplete){
                const profile=catalog.profiles.find(p=>p.id===record.id);
                assert(profile,`Missing conference admitted profile ${record.id}`);
                assert.equal(profile.researchStatus.batch,conferenceBatchId);
                assert.equal(index.entries.filter(x=>x.u===`/ai/architects/#${record.id}`).length,1);
                if(!targets.some(([,id])=>id===record.id)) targets.push([profile.name,profile.id]);
              }
              const remainingBatchId='2026-11-12-conference-remaining';
              const remainingBatchPath=`ai/architects/research/batches/${remainingBatchId}.json`;
              assert(fs.existsSync(remainingBatchPath),'Missing remaining followup admission batch');
              const remainingBatch=JSON.parse(fs.readFileSync(remainingBatchPath,'utf8'));
              assert(Array.isArray(remainingBatch.records),'Remaining batch records must be an array');
              const remainingComplete=remainingBatch.records.filter(r=>r.status==='complete');
              const remainingPending=remainingBatch.records.filter(r=>r.status!=='complete');
              assert(remainingBatch.completedNew>0,'Remaining batch must admit at least one new profile');
              assert.equal(remainingComplete.filter(r=>r.kind==='candidate').length,remainingBatch.completedNew);
              assert.equal(remainingComplete.filter(r=>r.kind==='existing').length,remainingBatch.completedExisting);
              assert.equal(remainingComplete.length,remainingBatch.completedNew+remainingBatch.completedExisting);
              assert.equal(remainingBatch.records.length,remainingBatch.plannedScope);
              assert.equal(new Set(remainingBatch.records.map(r=>r.id)).size,remainingBatch.records.length);
              const remainingActualCounts={};
              for(const record of remainingBatch.records) remainingActualCounts[record.status]=(remainingActualCounts[record.status]||0)+1;
              assert.deepEqual(remainingBatch.counts,remainingActualCounts);
              for(const record of remainingComplete){
                const profile=catalog.profiles.find(p=>p.id===record.id);
                assert(profile,`Missing remaining admitted profile ${record.id}`);
                assert.equal(profile.researchStatus.batch,remainingBatchId);
                assert.equal(index.entries.filter(x=>x.u===`/ai/architects/#${record.id}`).length,1);
                if(!targets.some(([,id])=>id===record.id)) targets.push([profile.name,profile.id]);
              }
              const excludedPending=[...pending,...conferencePending.filter(r=>r.kind==='candidate'),...remainingPending.filter(r=>r.kind==='candidate')];
              for(const record of excludedPending){
                assert(!catalog.profiles.some(p=>p.id===record.id),`Pending candidate in catalog: ${record.id}`);
                assert(!index.entries.some(x=>x.u===`/ai/architects/#${record.id}`),`Pending candidate in search: ${record.id}`);
              }
              report.remainingAdmissionBatch=remainingBatchPath;
              report.remainingCompletedNew=remainingBatch.completedNew;
              report.conferenceAdmissionBatch=conferenceBatchPath;
              report.conferenceCompletedNew=conferenceBatch.completedNew;
              report.admissionBatch=batchPath;
              report.followupAdmissionBatch=laraBatchPath;
              report.pendingExcluded=excludedPending.map(r=>r.id);
              report.testedProfiles=targets;
              assert.equal(index.count,index.entries.length);
              assert(!index.entries.some(x=>x.u.includes('/research/')));
              for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
                const page=await browser.newPage({viewport});
                const errors=[],failed=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:8765/')&&r.status()>=400)failed.push({url:r.url(),status:r.status()});});
                assert.equal((await page.goto('http://127.0.0.1:8765/ai/architects/',{waitUntil:'networkidle'})).status(),200);
                assert.equal(await page.locator('article.profile').count(),expectedProfiles);
                const matrixDomains=await page.locator('#architect-skill-table tbody .matrix-domain').allTextContents();
                const domainBlocks=matrixDomains.filter((value,index)=>index===0||value!==matrixDomains[index-1]);
                assert.equal(domainBlocks.length,new Set(matrixDomains).size,'Each main field must occupy one contiguous block');
                assert.equal(await page.locator('#architect-skill-table thead [aria-sort="ascending"]').count(),1);
                await page.locator('#skill-matrix').scrollIntoViewIfNeeded();
                await page.screenshot({path:`browser-results/matrix-domain-${viewport.width}.png`});

                for(const record of excludedPending) assert.equal(await page.locator(`article.profile[id="${record.id}"]`).count(),0);
                for(const [name,id] of targets){
                  await page.locator('#matrix-name').fill(name);
                  const row=page.locator('#architect-skill-table tbody tr:not([hidden])');
                  assert.equal(await row.count(),1);
                  assert.equal(await row.locator(`a[href="#${id}"]`).count(),1);
                  await row.locator(`a[href="#${id}"]`).click();
                  await page.locator(`#${id}`).waitFor({state:'visible'});
                  const summary=page.locator(`#${id} details.research-detail > summary`).first();
                  assert.equal(await summary.count(),1);await summary.click();assert.equal(await summary.evaluate(e=>e.parentElement.open),true);
                }
                await page.locator('#matrix-name').fill('');
                assert.equal(await page.locator('#architect-skill-table tbody tr:not([hidden])').count(),expectedProfiles);
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2),false);
                await page.screenshot({path:`browser-results/architects-${viewport.width}.png`});
                for(const [name,id] of targets){
                  await page.goto('http://127.0.0.1:8765/ai/search.html',{waitUntil:'networkidle'});
                  await page.waitForFunction(()=>document.querySelector('#count').textContent.includes('entries indexed'));
                  await page.locator('#q').fill(name);
                  await page.locator('#chips [data-s="architects"]').click();
                  const link=page.locator(`#results a[href="/ai/architects/#${id}"]`);
                  assert.equal(await link.count(),1);await link.click();
                  await page.locator(`#${id}`).waitFor({state:'visible'});
                }
                await page.goto('http://127.0.0.1:8765/ai/search.html',{waitUntil:'networkidle'});
                await page.waitForFunction(()=>document.querySelector('#count').textContent.includes('entries indexed'));
                await page.locator('#q').fill('zzznomatch-architects-smoke');
                assert((await page.locator('#count').innerText()).startsWith('0 '));
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2),false);
                await page.screenshot({path:`browser-results/search-${viewport.width}.png`});
                report.rows.push({viewport,profiles:expectedProfiles,indexEntries:index.count,filters:true,searchAndAnchors:true,noResult:true,jsErrors:errors,failedResources:failed});
                assert.deepEqual(errors,[]);assert.deepEqual(failed,[]);await page.close();
              }
              report.status='passed';
            }catch(e){report.status='failed';report.error=e.stack;throw e;}
            finally{fs.writeFileSync('browser-results/report.json',JSON.stringify(report,null,2)+'\n');await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architects-browser-${{ github.event.pull_request.head.sha }}
          path: browser-results/
          retention-days: 14
