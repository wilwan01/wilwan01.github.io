name: Analyst case browser smoke
on:
  pull_request:
    paths:
      - 'ai/analysts/cases/**'
      - 'scripts/check-analyst-case.cjs'
      - 'scripts/check-gpu-lifecycle.cjs'
      - '.github/workflows/analyst-case-browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test exact PR head at desktop and mobile sizes
        env:
          NODE_PATH: ${{ runner.temp }}/browser-deps/node_modules
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p browser-results
          python3 -m http.server 8765 --bind 127.0.0.1 > browser-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ai/architects/catalog.json -o /dev/null; then break; fi
            sleep 1
          done
          python3 -m py_compile scripts/build-research-home.py
          node scripts/check-analyst-case.cjs
          node scripts/check-gpu-lifecycle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyst-case-browser-${{ github.event.pull_request.head.sha }}
          path: browser-results/
          retention-days: 14
