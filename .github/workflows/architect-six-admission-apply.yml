name: Apply approved architect admissions
on:
  push:
    branches: [codex/admit-six-architects-20261013]
    paths:
      - '.github/workflows/architect-six-admission-apply.yml'
      - 'ai/architects/tools/apply_approved_admissions_20261013.py'
permissions:
  contents: write
concurrency:
  group: architect-six-admissions-20261013
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/admit-six-architects-20261013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Incorporate current master without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-edit origin/master
      - name: Prepare renderer dependency
        run: python -c 'import lxml' || python -m pip install lxml
      - name: Apply bounded migration and render
        run: |
          python -m py_compile ai/architects/tools/apply_approved_admissions_20261013.py
          python ai/architects/tools/apply_approved_admissions_20261013.py --check
          python ai/architects/tools/apply_approved_admissions_20261013.py > /tmp/architect-six-admissions-result.json
          python ai/architects/tools/render_contribution_batch.py
      - name: Verify catalog, cards, counts, references and idempotence
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          from lxml import html
          root = Path('ai/architects')
          spec = importlib.util.spec_from_file_location('admissions', root/'tools/apply_approved_admissions_20261013.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          catalog = json.loads((root/'catalog.json').read_text())
          profiles = catalog['profiles']
          ids = {p['id'] for p in profiles}
          assert len(ids) == len(profiles)
          assert mod.TARGETS <= ids and mod.PENDING not in ids
          assert catalog['research']['totalProfiles'] == len(profiles)
          for domain in catalog['domains']:
              assert domain['members'] == [p['id'] for p in profiles if p['domain'] == domain['id']]
          page = html.fromstring((root/'index.html').read_text())
          for pid in mod.TARGETS:
              assert len(page.xpath('//article[@id="'+pid+'"]')) == 1, pid
              assert page.xpath('//*[@id="directory"]//a[@href="#'+pid+'"]'), pid
              assert page.xpath('//aside[contains(@class,"toc")]//a[@href="#'+pid+'"]'), pid
              assert page.xpath('//*[@id="architect-skill-table"]//a[@href="#'+pid+'"]'), pid
          assert not page.xpath('//article[@id="yan-xie"]')
          assert not page.xpath('//*[@id="directory"]//a[@href="#yan-xie"]')
          assert len(page.xpath('//*[@id="architect-skill-table"]/tbody/tr')) == len(profiles)
          assert str(len(profiles)) in page.xpath('//*[@id="directory"]/h2')[0].text_content()
          assert str(len(profiles)) in page.xpath('//div[@class="stats"]')[0].text_content()
          pending = json.loads((root/'research/yan-xie-admission-pending-20261013.json').read_text())
          assert pending['status'] == 'needs_more_evidence'
          assert pending['previousProfilePreserved']['id'] == 'yan-xie'
          check = mod.apply(json.loads((root/'catalog.json').read_text()), root, write=False)
          assert check['catalogChanged'] is False, 'Migration must be idempotent'
          report = json.loads(Path('/tmp/architect-six-admissions-result.json').read_text())
          report['validation'] = {'targetEvidence': 'pass', 'unrelatedProfiles': 'pass', 'duplicateIds': 'pass', 'domainCounts': 'pass', 'directorySidebarMatrix': 'pass', 'pendingArchive': 'pass', 'idempotence': 'pass'}
          report['runId'] = os.environ['GITHUB_RUN_ID']
          report['publication'] = 'branch-rendered-not-yet-live-verified'
          (root/'research/six-admissions-20261013-validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-shot bootstrap and commit only intended changes
        run: |
          rm -f ai/architects/tools/apply_six_admissions_20261013.py
          rm -f ai/architects/research/six-admissions-20261013-snapshot.json
          rm -f .github/workflows/architect-six-admission-audit.yml
          rm -f .github/workflows/architect-six-admission-apply.yml
          git add ai/architects/catalog.json ai/architects/index.html
          git add ai/architects/research/yan-xie-admission-pending-20261013.json
          git add ai/architects/research/six-admissions-20261013-validation.json
          git add ai/architects/research/batches/2026-10-13-approved-six.json ai/architects/research/batches/2026-10-13-approved-six.html
          git add -u ai/architects/tools/apply_six_admissions_20261013.py ai/architects/research/six-admissions-20261013-snapshot.json .github/workflows/architect-six-admission-audit.yml .github/workflows/architect-six-admission-apply.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Apply six reviewed architect decisions and archive Yan Xie pending evidence'
            git push origin HEAD:codex/admit-six-architects-20261013
          fi
