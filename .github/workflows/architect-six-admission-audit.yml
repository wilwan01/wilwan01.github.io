name: Architect six-admission audit
on:
  push:
    branches: [codex/admit-six-architects-20261013]
    paths:
      - '.github/workflows/architect-six-admission-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/codex/admit-six-architects-20261013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only approved targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('ai/architects')
          catalog = json.loads((root/'catalog.json').read_text())
          ids = {'heng-liao', 'shouyi-yin', 'peng-ouyang', 'xinyu-niu', 'kuen-hung-tsoi', 'yang-jiao-hanguang', 'yan-xie'}
          profiles = catalog['profiles']
          selected = [p for p in profiles if p.get('id') in ids]
          out = {'keys': list(catalog), 'profile_count': len(profiles), 'domains': catalog.get('domains'), 'research': catalog.get('research'), 'profiles': selected, 'missing_ids': sorted(ids-{p['id'] for p in selected})}
          path = root/'research'/'six-admissions-20261013-snapshot.json'
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2)+'\n')
          print('Selected', len(selected), 'existing profiles; missing', out['missing_ids'])
          PY
      - name: Commit inspection artifact to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/architects/research/six-admissions-20261013-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual schema and target records for admission migration'
            git push origin HEAD:codex/admit-six-architects-20261013
          fi
